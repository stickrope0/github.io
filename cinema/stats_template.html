<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>新宿シネマ｜上映データ</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--bg-sub:#f4f4f4;--card:#ffffff;
  --text:#1f1f1f;--sub:#6b6b6b;--muted:#8f8f8f;--line:#e6e6e6;
  --grid:#ececec;--axis:#c9c9c9;
  --ink:#1f1f1f;--ink-text:#ffffff;--star:#ffb800;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--other:#b9b8b2;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212;--bg-sub:#1b1b1b;--card:#1e1e1e;
  --text:#ececec;--sub:#a5a5a5;--muted:#8a8a8a;--line:#2c2c2c;
  --grid:#2a2a2a;--axis:#3d3d3d;
  --ink:#ececec;--ink-text:#121212;--star:#ffc233;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--other:#5c5b57;
}}
:root[data-theme="dark"]{
  --bg:#121212;--bg-sub:#1b1b1b;--card:#1e1e1e;
  --text:#ececec;--sub:#a5a5a5;--muted:#8a8a8a;--line:#2c2c2c;
  --grid:#2a2a2a;--axis:#3d3d3d;
  --ink:#ececec;--ink-text:#121212;--star:#ffc233;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--other:#5c5b57;
}
body{background:var(--bg-sub);color:var(--text);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}

/* ── Header（viewer と共通） ── */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.hd-in{max-width:1080px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:16px}
.logo{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;white-space:nowrap;margin-right:auto}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--ink-text);display:grid;place-items:center;font-size:.8rem}
.theme-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.theme-btn:hover{background:var(--bg-sub)}
.nav{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:24px}
.nav a{padding:10px 0 11px;font-size:.88rem;font-weight:700;color:var(--sub);border-bottom:3px solid transparent}
.nav a[aria-current="page"]{color:var(--text);border-color:var(--ink)}

main{max-width:1080px;margin:0 auto;padding:20px 16px 64px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.8rem;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.seg{display:inline-flex;background:var(--bg-sub);border-radius:8px;padding:3px;gap:2px;flex-shrink:0}
.seg button{padding:5px 12px;border-radius:6px;font-size:.8rem;font-weight:700;color:var(--sub);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* 開閉式カード */
details.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .chev{flex-shrink:0;color:var(--sub);transition:transform .2s}
details.acc[open]>summary .chev{transform:rotate(180deg)}
details.acc>summary:hover h2{text-decoration:underline;text-underline-offset:3px}

/* ── Stat tiles ── */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:8px;padding:14px 16px}
.tile-label{font-size:.75rem;color:var(--sub);font-weight:600}
.tile-value{font-size:1.6rem;font-weight:700;line-height:1.3}
.tile-value small{font-size:.8rem;color:var(--sub);font-weight:600;margin-left:2px}

/* ── Card ── */
.card{background:var(--card);border-radius:8px;padding:18px 16px 16px;margin-bottom:16px}
@media(min-width:700px){.card{padding:22px 24px 20px}}
.card h2{font-size:1rem;font-weight:800}
.card .desc{font-size:.78rem;color:var(--sub);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 6px;font-size:.74rem;color:var(--sub)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.legend i.dot{border-radius:50%}
details.table-view{margin-top:14px;font-size:.78rem}
details.table-view summary{cursor:pointer;color:var(--sub);font-weight:600;width:max-content}
.tbl-wrap{overflow-x:auto;margin-top:8px;max-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);max-width:200px;overflow:hidden;text-overflow:ellipsis}
thead th{position:sticky;top:0;background:var(--card);color:var(--sub);font-weight:600;z-index:1}
thead th:first-child{z-index:2}

/* ── ① ランキング（積み上げ横棒） ── */
.bars{margin-top:10px}
.bar-row{display:grid;grid-template-columns:1fr;gap:3px;padding:6px 4px;border-radius:6px;cursor:pointer}
@media(min-width:700px){.bar-row{grid-template-columns:220px 1fr;gap:12px;align-items:center}}
.bar-row:hover,.bar-row:focus-visible{background:var(--bg-sub)}
.bar-title{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title b{display:inline-block;width:1.8em;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.bar-track{display:flex;align-items:center;gap:8px;min-width:0}
.bar{display:flex;gap:2px;height:16px;min-width:0}
.bar span{height:100%;flex-shrink:0}
.bar span:last-child{border-radius:0 4px 4px 0}
.bar-val{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.more{margin-top:10px;font-size:.8rem;font-weight:700;color:var(--sub);padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.more:hover{color:var(--text)}

.note{font-size:.72rem;color:var(--muted);margin-top:6px}

/* ── 上映回数の推移 ── */
.trend{position:relative;margin-top:6px}
.trend svg{display:block;width:100%;overflow:visible}
.lg-x{width:18px;height:18px;border-radius:50%;font-size:.8rem;line-height:1;color:var(--sub);display:grid;place-items:center}
.lg-x:hover{background:var(--line);color:var(--text)}
.legend i.ln{height:3px;width:14px;border-radius:2px}
/* 推移の凡例：番号つきのボタン。押すとその線を強調 */
#trendLegend{gap:6px}
.lg-item{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 8px 3px 3px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.74rem;color:var(--sub);text-align:left}
.lg-item[aria-pressed="true"]{border-color:var(--text);color:var(--text);font-weight:700}
.lg-no{flex-shrink:0;min-width:18px;height:18px;padding:0 4px;border-radius:999px;color:#fff;font-size:.66rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
#trendLegend .lg-title{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){#trendLegend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.lg-item{border-radius:6px;min-width:0}}

/* ── Tooltip ── */
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.14);border-radius:6px;padding:8px 10px;font-size:.75rem;min-width:120px;max-width:260px;opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
#tip .tt-head{font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip .tt-row{display:flex;align-items:center;gap:6px;line-height:1.6}
#tip .tt-row i{width:10px;height:2px;border-radius:1px;flex-shrink:0}
#tip .tt-row b{font-variant-numeric:tabular-nums;min-width:2.4em;text-align:right}
#tip .tt-row span{color:var(--sub)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd-in">
    <a class="logo" href="viewer.html#/"><span class="logo-mark">▶</span><span>新宿シネマ</span></a>
    <button class="theme-btn" id="themeBtn" aria-label="テーマ切替">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <nav class="nav">
    <a href="viewer.html#/">作品から探す</a>
    <a href="viewer.html#/theaters">劇場から探す</a>
    <a href="stats.html" aria-current="page">グラフ</a>
  </nav>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <div>
        <h2>上映回数の推移</h2>
        <p class="desc">今週の上映回数が多い7作品と、check した作品の「1日あたりの平均上映回数」です。</p>
      </div>
      <div class="seg" id="rangeSeg" role="group" aria-label="表示期間"></div>
    </div>
    <div class="legend" id="trendLegend"></div>
    <div class="trend" id="trend"></div>
    <p class="note" id="histNote"></p>
    <details class="table-view"><summary>表で見る（全作品）</summary><div class="tbl-wrap" id="trendTable"></div></details>
  </section>

  <details class="card acc">
    <summary>
      <div>
        <h2>上映回数ランキング</h2>
        <p class="desc" id="rankDesc"></p>
      </div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </summary>
    <div class="legend" id="rankLegend"></div>
    <div class="bars" id="bars"></div>
    <button class="more" id="moreBtn"></button>
    <details class="table-view"><summary>表で見る</summary><div class="tbl-wrap" id="rankTable"></div></details>
  </details>

  <section class="card">
    <h2>上映終了の判定の実績</h2>
    <p class="desc">毎週の「終了濃厚」「終了注意」の判定が、翌週の取得で実際に当たったかを集計しています。</p>
    <div id="evalBody"></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>

<script>
/*@include check_sync.js*/
const RAW = DATA_PLACEHOLDER;
const PREV = PREV_PLACEHOLDER;
const HIST = HIST_PLACEHOLDER;
// 上映終了の判定の答え合わせ（end_judge.py が毎週追記）
const EVAL = EVAL_PLACEHOLDER;

const W = ['日','月','火','水','木','金','土'];
const DATES = [...new Set(RAW.map(r => r.date))].sort();
const PREV_IDS = new Set(PREV.map(r => r.movie_id));
const state = { range: 1, showAll: false, focus: null };
const RANGES = [1, 2, 3];
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const el = (tag, attrs = {}, text) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};
const SVGNS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs = {}) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
};
const md = d => { const t = new Date(d + 'T00:00:00'); return `${t.getMonth() + 1}/${t.getDate()}`; };
const PERIOD = `${md(DATES[0])}〜${md(DATES[DATES.length - 1])}`;
const movieUrl = id => `viewer.html#/movie/${encodeURIComponent(id)}`;
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

// ── 劇場の色：全期間の上映回数順に固定（日付を切り替えても色は変わらない） ──
const TH_TOTAL = {};
for (const r of RAW) TH_TOTAL[r.theater_name] = (TH_TOTAL[r.theater_name] || 0) + r.showtimes.length;
const TH_ORDER = Object.keys(TH_TOTAL).sort((a, b) => TH_TOTAL[b] - TH_TOTAL[a]);
const MAIN_TH = TH_ORDER.slice(0, 7);
const OTHER_TH = TH_ORDER.slice(7);
const GROUPS = [...MAIN_TH.map((t, i) => ({ key: t, label: t, color: `var(--s${i + 1})` }))];
if (OTHER_TH.length) GROUPS.push({ key: '__other', label: `その他（${OTHER_TH.length}館）`, color: 'var(--other)', members: OTHER_TH });
const groupOf = th => MAIN_TH.includes(th) ? th : '__other';

// ── 集計 ──
function aggregate() {
  const map = {};
  for (const r of RAW) {
    const m = map[r.movie_id] ??= { id: r.movie_id, title: r.title, star: parseFloat(r.star) || 0,
      isNew: PREV.length > 0 && !PREV_IDS.has(r.movie_id), total: 0, byGroup: {}, theaters: new Set() };
    const n = r.showtimes.length;
    m.total += n;
    m.byGroup[groupOf(r.theater_name)] = (m.byGroup[groupOf(r.theater_name)] || 0) + n;
    m.theaters.add(r.theater_name);
  }
  return Object.values(map).filter(m => m.total > 0).sort((a, b) => b.total - a.total || b.star - a.star);
}

// ── Tooltip ──
const tip = $('tip');
function showTip(x, y, head, rows) {
  tip.replaceChildren(el('div', { class: 'tt-head' }, head));
  for (const [color, value, label] of rows) {
    const row = el('div', { class: 'tt-row' });
    const key = el('i'); key.style.background = color || 'transparent';
    row.append(key, el('b', {}, value), el('span', {}, label));
    tip.append(row);
  }
  tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + 'px';
  tip.style.top = Math.max(8, top) + 'px';
}
const hideTip = () => tip.classList.remove('on');
const centerOf = e => { const r = e.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

// ── ① ランキング ──
function renderRanking(movies) {
  $('rankDesc').textContent = `${PERIOD}の合計。棒の色は劇場です。`;
  $('rankLegend').replaceChildren(...GROUPS.map(g => {
    const s = el('span'); const i = el('i'); i.style.background = g.color;
    s.append(i, document.createTextNode(g.label));
    if (g.members) s.title = g.members.join('、');
    return s;
  }));
  const LIMIT = 20;
  const list = state.showAll ? movies : movies.slice(0, LIMIT);
  const max = movies[0]?.total || 1;
  $('bars').replaceChildren(...list.map((m, idx) => {
    const row = el('a', { class: 'bar-row', href: movieUrl(m.id), 'aria-label': `${m.title} ${m.total}回` });
    const title = el('div', { class: 'bar-title' });
    title.append(el('b', {}, String(idx + 1)), document.createTextNode(m.title));
    const track = el('div', { class: 'bar-track' });
    const bar = el('div', { class: 'bar' });
    const segs = GROUPS.filter(g => m.byGroup[g.key]);
    // 2pxの隙間の分を差し引いて、棒の長さを回数に比例させる
    bar.style.width = `calc(${(m.total / max) * 88}% )`;
    for (const g of segs) {
      const s = el('span'); s.style.background = g.color;
      s.style.width = `calc((100% - ${(segs.length - 1) * 2}px) * ${m.byGroup[g.key] / m.total})`;
      bar.append(s);
    }
    track.append(bar, el('span', { class: 'bar-val' }, `${m.total}回`));
    row.append(title, track);
    const rows = () => segs.map(g => [g.color, `${m.byGroup[g.key]}回`, g.label]);
    row.addEventListener('pointermove', e => showTip(e.clientX, e.clientY, m.title, rows()));
    row.addEventListener('pointerleave', hideTip);
    row.addEventListener('focus', () => { const [x, y] = centerOf(bar); showTip(x, y, m.title, rows()); });
    row.addEventListener('blur', hideTip);
    return row;
  }));
  const btn = $('moreBtn');
  btn.hidden = movies.length <= LIMIT;
  btn.textContent = state.showAll ? '上位20作品だけ表示' : `すべて表示（${movies.length}作品）`;
  btn.onclick = () => { state.showAll = !state.showAll; render(); };

  // 表
  const tbl = el('table');
  const hr = el('tr');
  hr.append(el('th', {}, '作品'), el('th', {}, '合計'), ...GROUPS.map(g => el('th', {}, g.label)));
  tbl.append(el('thead')); tbl.tHead.append(hr);
  const tb = el('tbody');
  for (const m of movies) {
    const tr = el('tr');
    tr.append(el('td', { title: m.title }, m.title), el('td', {}, String(m.total)), ...GROUPS.map(g => el('td', {}, String(m.byGroup[g.key] || ''))));
    tb.append(tr);
  }
  tbl.append(tb);
  $('rankTable').replaceChildren(tbl);
}

// ── 上映回数の推移（今週の上位7作品＋checkした作品） ──
const TREND_TOP = 7;
// check が変わったら（別タブ・別端末からの同期を含む）描き直す
Checks.onChange(() => renderTrend());

// 整数の目盛り：データの最大値から、目盛りが maxTicks 本以内に収まる切りのよい間隔を選ぶ
function intScale(max, maxTicks) {
  for (const step of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500]) {
    const top = Math.max(step, Math.ceil(max / step) * step);
    if (top / step <= maxTicks) return { top, step };
  }
  return { top: Math.ceil(max), step: Math.ceil(max / maxTicks) };
}

function renderTrend() {
  $('rangeSeg').replaceChildren(...RANGES.map(n => {
    const b = el('button', { 'aria-pressed': state.range === n }, `${n}か月`);
    b.onclick = () => { state.range = n; renderTrend(); };
    return b;
  }));
  // 最新の取得日からさかのぼって、選んだ月数に入る取得回だけを使う
  const last = new Date(HIST.points[HIST.points.length - 1].date + 'T00:00:00');
  const from = new Date(last); from.setMonth(from.getMonth() - state.range);
  const idx = HIST.points.map((p, i) => i).filter(i => new Date(HIST.points[i].date + 'T00:00:00') >= from);
  const pts = idx.map(i => HIST.points[i]);
  const seriesOf = id => ({ id, title: HIST.movies[id].title, vals: idx.map(i => HIST.movies[id].vals[i]) });

  // 色は上位7作品に固定（期間を切り替えても変わらない）。checkした作品は墨色の線で描き、番号と名前で見分ける
  const checked = Checks.all();
  const topIds = aggregate().map(m => m.id).filter(id => HIST.movies[id]).slice(0, TREND_TOP);
  const colorOf = Object.fromEntries(topIds.map((id, i) => [id, css(`--s${i + 1}`)]));
  const tops = topIds.map(seriesOf);
  const extra = [...checked].filter(id => HIST.movies[id] && !colorOf[id]).map(seriesOf);
  const shownExtra = extra.filter(s => s.vals.some(v => v > 0));
  const noShow = extra.filter(s => !s.vals.some(v => v > 0));
  const ink = css('--text');
  const series = [...tops, ...shownExtra];
  series.forEach((s, i) => { s.no = i + 1; });
  const colorFor = s => colorOf[s.id] || ink;
  if (!series.some(s => s.id === state.focus)) state.focus = null;

  const box = $('trend');
  const width = box.clientWidth || 600;
  const narrow = width < 560;
  const height = narrow ? 300 : 360;
  const M = { l: 30, r: narrow ? 26 : 150, t: 16, b: 28 };
  const iw = width - M.l - M.r, ih = height - M.t - M.b;
  const { top: yMax, step } = intScale(Math.max(1, ...series.flatMap(s => s.vals)), narrow ? 4 : 5);
  const X = i => M.l + (pts.length > 1 ? i / (pts.length - 1) * iw : iw / 2);
  const Y = v => M.t + ih - v / yMax * ih;
  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, height, role: 'img', 'aria-label': '上映回数の推移' });
  svg.style.touchAction = 'pan-y';
  const text = (x, y, str, attrs = {}) => {
    const t = svgEl('text', { x, y, 'font-size': narrow ? 11 : 10, fill: css('--muted'), ...attrs });
    t.textContent = str; svg.append(t); return t;
  };

  for (let v = 0; v <= yMax; v += step) {
    const y = Y(v);
    svg.append(svgEl('line', { x1: M.l, x2: M.l + iw, y1: y, y2: y, stroke: v ? css('--grid') : css('--axis'), 'stroke-width': 1 }));
    text(M.l - 6, y + 4, String(v), { 'text-anchor': 'end' });
  }
  // 日付：詰まる場合は間引く（最新の日付は必ず出す）
  const every = Math.max(1, Math.ceil(40 / (iw / Math.max(1, pts.length - 1))));
  pts.forEach((p, i) => {
    const lastPt = i === pts.length - 1;
    if (!lastPt && (pts.length - 1 - i) % every) return;
    text(X(i), height - 8, md(p.date), { 'text-anchor': narrow && i === 0 ? 'start' : narrow && lastPt ? 'end' : 'middle' });
  });
  text(M.l, M.t - 5, '回/日', { fill: css('--sub') });

  const pathOf = s => s.vals.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  const lineAttrs = { fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
  const surface = css('--card');
  const marks = new Map();
  // 1位が一番上に来るよう逆順に描く
  for (const s of [...series].reverse()) {
    const c = colorFor(s);
    const path = svgEl('path', { d: pathOf(s), stroke: c, 'stroke-width': 2, ...lineAttrs });
    const li = s.vals.length - 1;
    const dot = svgEl('circle', { cx: X(li), cy: Y(s.vals[li]), r: 4, fill: c, stroke: surface, 'stroke-width': 2 });
    svg.append(path, dot);
    marks.set(s.id, [path, dot]);
  }
  const cross = svgEl('line', { y1: M.t, y2: M.t + ih, stroke: css('--muted'), 'stroke-width': 1, visibility: 'hidden' });
  svg.prepend(cross);
  box.replaceChildren(svg);

  // 右端のラベル：PCは作品名、スマホは凡例と対応する番号（重なる場合は描かない）
  const placed = [];
  for (const s of series) {
    const li = s.vals.length - 1;
    const name = narrow ? String(s.no) : `${s.no} ${s.title.length > 10 ? s.title.slice(0, 10) + '…' : s.title}`;
    const t = text(X(li) + 8, Y(s.vals[li]) + 4, name, { fill: css('--text'), 'font-size': 11, 'font-weight': 700 });
    t.dataset.id = s.id;
    const b = t.getBBox();
    if (placed.some(q => b.y < q.y + q.height && q.y < b.y + b.height)) { t.remove(); continue; }
    placed.push(b);
    marks.get(s.id).push(t);
  }

  // 強調：指定した線を太く、他を薄くする（凡例のタップ・線へのホバーで使う）
  const emphasize = id => {
    for (const [sid, els] of marks) {
      for (const e of els) e.style.opacity = !id || sid === id ? 1 : .2;
      els[0].setAttribute('stroke-width', sid === id ? 3 : 2);
    }
    if (id) svg.append(...marks.get(id)); // 前面へ
  };
  emphasize(state.focus);

  // 凡例：番号つき。押すとその作品を強調（もう一度押すと解除）。checkした作品は × で外せる
  $('trendLegend').replaceChildren(...series.map(s => {
    const item = el('button', { class: 'lg-item' + (colorOf[s.id] ? '' : ' lg-chk'), 'aria-pressed': state.focus === s.id });
    const no = el('b', { class: 'lg-no' }, String(s.no)); no.style.background = colorFor(s);
    item.append(no, el('span', { class: 'lg-title' }, (checked.has(s.id) ? '✓ ' : '') + s.title));
    item.onclick = e => {
      if (e.target.closest('.lg-x')) return;
      state.focus = state.focus === s.id ? null : s.id;
      renderTrend();
    };
    if (!colorOf[s.id]) {
      const x = el('span', { class: 'lg-x', role: 'button', tabindex: 0, 'aria-label': `${s.title}のcheckを外す`, title: 'checkを外す' }, '×');
      x.onclick = () => Checks.remove(s.id);
      x.onkeydown = e => { if (e.key === 'Enter') Checks.remove(s.id); };
      item.append(x);
    }
    return item;
  }));

  // ホバー／タップ：一番近い取得日に吸着し、その日で縦方向に一番近い線（24px以内）を強調
  let hot = null;
  const inspect = e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * width / r.width, py = (e.clientY - r.top) * height / r.height;
    let i = 0;
    for (let k = 1; k < pts.length; k++) if (Math.abs(X(k) - px) < Math.abs(X(i) - px)) i = k;
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('visibility', 'visible');
    const prevHot = hot;
    hot = null; let bd = 24;
    for (const s of series) { const d = Math.abs(Y(s.vals[i]) - py); if (d < bd) { bd = d; hot = s; } }
    emphasize(hot ? hot.id : state.focus);
    svg.style.cursor = hot ? 'pointer' : '';
    const rows = [...series].sort((a, b) => b.vals[i] - a.vals[i])
      .map(s => [colorFor(s), s.vals[i].toFixed(1), `${s.no}. ${s.title}`]);
    showTip(e.clientX, e.clientY, `${md(pts[i].date)}〜の週（1日あたりの回数）`, rows);
    return prevHot;
  };
  const clear = () => { cross.setAttribute('visibility', 'hidden'); emphasize(state.focus); hideTip(); hot = null; };
  svg.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') inspect(e); });
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') clear(); });
  svg.addEventListener('click', e => { if (hot && e.pointerType !== 'touch') location.href = movieUrl(hot.id); });
  // タッチ：タップで値を表示、同じ線をもう一度タップすると作品ページへ
  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const before = inspect(e);
    if (hot && before && before.id === hot.id) location.href = movieUrl(hot.id);
  });
  if (!renderTrend.outside) {
    renderTrend.outside = true;
    document.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' && !e.target.closest('#trend')) { hideTip(); }
    });
  }

  // 表（全作品。グラフに出ていない作品もここで読める）
  const sum = a => a.reduce((x, y) => x + y, 0);
  const all = Object.keys(HIST.movies).map(seriesOf).filter(s => s.vals.some(v => v > 0));
  const lastOf = s => s.vals[s.vals.length - 1];
  const tbl = el('table'); const hr = el('tr');
  hr.append(el('th', {}, '作品'), ...pts.map(p => el('th', {}, md(p.date))));
  tbl.append(el('thead')); tbl.tHead.append(hr);
  const tb = el('tbody');
  for (const s of all.sort((a, b) => lastOf(b) - lastOf(a) || sum(b.vals) - sum(a.vals))) {
    const tr = el('tr');
    tr.append(el('td', { title: s.title }, (checked.has(s.id) ? '✓ ' : '') + s.title), ...s.vals.map(v => el('td', {}, v ? v.toFixed(1) : '')));
    tb.append(tr);
  }
  tbl.append(tb);
  $('trendTable').replaceChildren(tbl);

  const first = new Date(HIST.points[0].date + 'T00:00:00');
  const notes = [];
  if (first > from) notes.push(`データは${md(HIST.points[0].date)}からしかないため、それ以前は表示されません。`);
  if (!checked.size) notes.push('作品一覧の ✓ ボタンで check した作品も、ここに追加されます。');
  if (noShow.length) notes.push(`checkした作品のうち「${noShow.map(s => s.title).join('」「')}」は、この期間に上映がありません。`);
  const thMin = Math.min(...pts.map(p => p.theaters)), thMax = Math.max(...pts.map(p => p.theaters));
  notes.push(`同じ週に複数回取得した日はまとめています${thMin !== thMax ? `。取得した劇場数は回によって${thMin}〜${thMax}館と異なります` : ''}。`);
  $('histNote').textContent = notes.join('');
}

// ── 上映終了の判定の実績 ──
function renderEval() {
  const body = $('evalBody');
  const done = EVAL.filter(e => !e.skipped);
  const ref = el('p', { class: 'note' }, '参考：判定条件を決めた過去データ（7〜9月）では、的中率 79%・終了作品の事前警告 36%・継続作品への誤警告 4% でした。');
  if (!done.length) {
    body.replaceChildren(el('p', { class: 'desc' }, '答え合わせは次回の取得（毎週火曜）から始まります。'), ref);
    return;
  }
  let movies = 0, ended = 0, hit = 0, miss = 0, fp = 0;
  const lv = { high: [0, 0], watch: [0, 0] };
  for (const e of done) {
    movies += e.movies; ended += e.ended;
    for (const a of e.alerts) { lv[a.level][a.ended ? 0 : 1]++; a.ended ? hit++ : fp++; }
    miss += e.missed.length;
  }
  const pct = (a, b) => b ? `${Math.round(a / b * 100)}%` : '—';
  const tiles = [
    ['警告の的中率', pct(hit, hit + fp), `${hit + fp}件中 ${hit}件が翌週に終了`],
    ['終了作品の事前警告', pct(hit, ended), `終了 ${ended}件のうち ${hit}件`],
    ['継続作品への誤警告', pct(fp, movies - ended), `継続 ${movies - ended}件のうち ${fp}件`],
  ];
  const grid = el('div', { class: 'tiles' });
  grid.style.marginTop = '12px';
  for (const [l, v, sub] of tiles) {
    const t = el('div', { class: 'tile' }); t.style.border = '1px solid var(--line)';
    t.append(el('div', { class: 'tile-label' }, l), el('div', { class: 'tile-value' }, v), el('div', { class: 'tile-label' }, sub));
    grid.append(t);
  }
  const tbl = el('table'); const hr = el('tr');
  for (const h of ['判定した週', '対象', '翌週終了', '濃厚（的中/警告）', '注意（的中/警告）', '見逃し']) hr.append(el('th', {}, h));
  tbl.append(el('thead')); tbl.tHead.append(hr);
  const tb = el('tbody');
  for (const e of [...EVAL].reverse()) {
    const tr = el('tr');
    if (e.skipped) { tr.append(el('td', {}, `${md(e.start)}〜`), el('td', { colspan: 5 }, e.skipped)); tb.append(tr); continue; }
    const c = l => { const a = e.alerts.filter(x => x.level === l); return `${a.filter(x => x.ended).length}/${a.length}`; };
    tr.append(el('td', {}, `${md(e.start)}〜`), el('td', {}, String(e.movies)), el('td', {}, String(e.ended)),
      el('td', {}, c('high')), el('td', {}, c('watch')), el('td', {}, String(e.missed.length)));
    tb.append(tr);
  }
  tbl.append(tb);
  // 警告した作品の結果一覧（直近の週）
  const last = done[done.length - 1];
  const list = el('ul'); list.style.cssText = 'margin:8px 0 0 1.2em;font-size:.78rem;line-height:1.8';
  for (const a of last.alerts) {
    list.append(el('li', {}, `${a.level === 'high' ? '終了濃厚' : '終了注意'}：${a.title} → ${a.ended ? '終了した（的中）' : '上映が続いた（外れ）'}`));
  }
  const det = el('details', { class: 'table-view' });
  det.append(el('summary', {}, `${md(last.start)}〜の週に警告した作品の結果`), list);
  const wrap = el('div', { class: 'tbl-wrap' }); wrap.append(tbl);
  body.replaceChildren(grid, wrap, det, ref);
}

function render() {
  const movies = aggregate();
  renderRanking(movies);
}
function renderAll() { render(); renderTrend(); renderEval(); }

$('themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', r.dataset.theme); } catch (_) {}
  renderAll();
});
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderAll);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderTrend, 150); });
renderAll();
</script>
