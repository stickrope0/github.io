name: GitHub Pages公開

on:
  push:
    branches:
      - master
  workflow_dispatch:
  # 週次取得の bot の push（GITHUB_TOKEN）では push トリガーが起動しないため、取得完了をきっかけに公開する
  workflow_run:
    workflows:
      - 新宿映画館スケジュール取得
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 取得が失敗したときは公開しない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: GitHub Pages設定
        uses: actions/configure-pages@v5

      - name: 公開ファイルをパッケージ
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
