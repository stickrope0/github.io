name: GitHub Pages公開

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: GitHub Pages設定
        uses: actions/configure-pages@v5

      - name: 公開ファイルをパッケージ
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
